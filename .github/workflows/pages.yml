name: 校验与发布年表
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      data_sha: ${{ steps.site.outputs.data_sha }}
      index_sha: ${{ steps.site.outputs.index_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: maintenance/requirements.txt
      - name: 校验数据、采集规则与网页脚本
        run: |
          python -m pip install -r maintenance/requirements.txt
          python maintenance/catalog.py check
          python -m unittest discover -s maintenance -p 'test_*.py'
          node --check assets/atlas.js
          bash -n maintenance/run-collector.sh
      - id: site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html assets data .nojekyll "$RUNNER_TEMP/site/"
          echo "data_sha=$(sha256sum data/releases.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "index_sha=$(sha256sum index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: 从公网校验本次首页与年表
        env:
          PAGE: ${{ steps.pages.outputs.page_url }}
          DATA_SHA: ${{ needs.validate.outputs.data_sha }}
          INDEX_SHA: ${{ needs.validate.outputs.index_sha }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "${PAGE%/}/data/releases.json?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/releases.json" &&
               curl -fsSL --max-time 15 "${PAGE%/}/?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/index.html" &&
               echo "$DATA_SHA  $RUNNER_TEMP/releases.json" | sha256sum --check --status &&
               echo "$INDEX_SHA  $RUNNER_TEMP/index.html" | sha256sum --check --status; then
              echo "已从公网核对本次首页与发布数据。"; exit 0
            fi
            sleep 8
          done
          echo "公网内容与本次发布不一致"; exit 1
